<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2-Personen-Counter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>

  
<body>
  <main class="app">
    <button id="p1Btn" class="player-btn player-1" type="button">
      <span class="player-label">Y</span>
      <span id="p1Count" class="player-count">0</span>
    </button>

    <button id="p2Btn" class="player-btn player-2" type="button">
      <span class="player-label">J</span>
      <span id="p2Count" class="player-count">0</span>
    </button>

    <button id="resetBtn" class="reset-btn" type="button">
      Zähler zurücksetzen
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.error("Service Worker Fehler:", err);
      });
    });
  }
</script>
</body>
</html>
